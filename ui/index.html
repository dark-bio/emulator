<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ark I emulator</title>
  <style>
    :root {
      color-scheme: dark;
      --led: #000000;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      /* Windowless: the launcher's window itself is transparent, so the body
       must paint nothing. Only the device + LEDs + pin appear on the desktop. */
      background: transparent;
      color: #ededed;
      font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Scene: a 220:297 box holding the whole device face. The window is given
     that same ratio so the two coincide and nothing is letterboxed, but the
     size is still solved against both axes so an off-ratio window shrinks the
     scene rather than overflowing it. */
    .scene {
      /* No text on the device face is there to be copied, and the panel's own
       background is a drag handle: without this, dragging the window from it
       highlights the labels instead. */
      user-select: none;
      --aspect-w: 220;
      --aspect-h: 297;
      --gutter: 2.9vmin;
      --row: 4.8vmin;
      --gap: 0.8vmin;
      width: min(100vw,
          calc(100vh * var(--aspect-w) / var(--aspect-h)));
      aspect-ratio: var(--aspect-w) / var(--aspect-h);
      position: relative;
    }

    /* Device fills the top portion of the scene (220/297 ≈ 74.1% of height). */
    .device {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      z-index: 2;
    }

    .device-img {
      display: block;
      width: 100%;
      height: 100%;
      -webkit-user-drag: none;
      user-select: none;
    }

    /* LED dots: 9/220 = 4.09% across; 23/220 = 10.45% from each corner edge.
     Box is square (aspect 1:1) so a single percentage works for both axes. */
    .led {
      position: absolute;
      width: 4.09%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: var(--led);
      box-shadow: 0 0 0.6vmin 0.1vmin rgba(0, 0, 0, 0.55);
    }

    .led.tl {
      top: 10.45%;
      left: 10.45%;
    }

    .led.tr {
      top: 10.45%;
      right: 10.45%;
    }

    .led.bl {
      bottom: 10.45%;
      left: 10.45%;
    }

    .led.br {
      bottom: 10.45%;
      right: 10.45%;
    }

    /* Reset pin. All measurements as a fraction of .scene's 220x297 box.
     - width: 18/220 = 8.18% of scene width
     - height: 54/297 = 18.18% of scene height
     - top: 220/297 = 74.07% (device's bottom edge). The pin hangs off the
            device rather than off the window, so it keeps its distance from
            the device and leaves the height the open tray claimed below it
            unused, which shows only while the tray is shut
     - right: 18/220 = 8.18% (mirrors the companion app's 42-of-500 offset)
     translateY uses pin's own height as 100%:
     - default: +10/54 = +18.5%  (gap below device)
     - hover  : +4/54  = +7.4%
     - active : -15%              (slides under the device; softer than the
                                   companion's reference for a less abrupt feel) */
    .reset-pin {
      position: absolute;
      top: 74.07%;
      right: 8.18%;
      width: 8.18%;
      height: 18.18%;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      /* Below the info tray, which covers the pin once open. */
      z-index: 0;
      transform: translateY(18.5%);
      transition: transform 0.16s cubic-bezier(0.2, 0.6, 0.2, 1),
        opacity 0.22s cubic-bezier(0.2, 0.6, 0.2, 1);
    }

    .reset-pin:hover {
      transform: translateY(7.4%);
    }

    /* .pressed wins over :hover (later, same specificity) so the cursor leaving
     the moving hitbox doesn't pop the press state back to hover. */
    .reset-pin.pressed {
      transform: translateY(-15%);
    }

    .reset-pin:focus-visible {
      outline: 0;
    }

    .reset-pin img {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
      -webkit-user-drag: none;
      user-select: none;
    }

    /* Info tray. Closed it tucks --tuck under the device and reads as a notch
     hanging off its bottom edge; open it drops clear of the device and runs to
     the bottom right of the window, over the reset pin. --band is the notch's
     visible height, and the header row the chevron sits in once open.
     Fractions of .scene's 220x297 box:
     - closed : top 213/297 = 71.72%, 30/220 = 13.64% wide, centred
     - open   : top 224/297 = 75.42%, a 4-unit gap below the device; flush with
                its left edge and the full width of the scene. Its height is
                solved from --rows rather than fixed, so the tray is only as
                tall as what it has to show; the full set of rows works out at
                the 24.58% that reaches the window's bottom edge, which is also
                the cap */
    .info {
      --tuck: 2.9vmin;
      --band: 5.8vmin;
      --chev: 4vmin;
      --radius: 3.2vmin;
      --rows: 1;
      position: absolute;
      top: 71.72%;
      left: 43.18%;
      width: 13.64%;
      height: calc(var(--tuck) + var(--band));
      z-index: 1;
      border-radius: 0 0 var(--radius) var(--radius);
      background: #0d0c0c;
      overflow: hidden;
      transition: top 0.22s cubic-bezier(0.2, 0.6, 0.2, 1),
        left 0.22s cubic-bezier(0.2, 0.6, 0.2, 1),
        width 0.22s cubic-bezier(0.2, 0.6, 0.2, 1),
        height 0.22s cubic-bezier(0.2, 0.6, 0.2, 1),
        border-radius 0.22s cubic-bezier(0.2, 0.6, 0.2, 1),
        opacity 0.22s cubic-bezier(0.2, 0.6, 0.2, 1),
        transform 0.16s cubic-bezier(0.2, 0.6, 0.2, 1);
    }

    /* The tray's own click target, and the column its rows stack in. A button
     rather than a handler on the tray itself, so the gear beside the chevron
     can be a button too; the rows stay inside it so their hover tooltips are
     not swallowed by an overlay. */
    .info-toggle {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: var(--gap);
      padding: var(--tuck) var(--gutter) 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: padding-top 0.22s cubic-bezier(0.2, 0.6, 0.2, 1);
    }

    .info.open .info-toggle {
      padding-top: var(--gutter);
    }

    /* The same nudge the reset pin answers a hover with. Translating rather
     than growing keeps the notch's contents centred in what shows of it. */
    .info:not(.open):hover {
      transform: translateY(1.4vmin);
    }

    .info.open {
      border-radius: var(--radius);
      top: 75.42%;
      left: 0;
      width: 100%;
      height: calc(2 * var(--gutter) + var(--rows) * var(--row) +
          (var(--rows) - 1) * var(--gap));
      max-height: 24.58%;
    }

    /* The tray is drawn over the pin, but only covers all of it at full
     height, so the pin steps aside for as long as the tray is open. */
    .info.open ~ .reset-pin {
      opacity: 0;
      pointer-events: none;
    }

    /* The tray's own chrome takes no focus ring, matching the reset pin. The
     panel's controls keep theirs: it is a form, and tabbing through one with
     nothing to show for it is worse than an outline that does not match. */
    .info-toggle:focus-visible,
    .info-gear:focus-visible {
      outline: 0;
    }

    /* Centred on the notch while closed, and on the far end of the header row
     once open. The closed offset is a fraction of the tray's own width, so the
     chevron rides the width animation rather than jumping across it. */
    .info-chevron {
      position: absolute;
      top: calc(var(--tuck) + var(--band) / 2);
      right: 50%;
      width: var(--chev);
      height: auto;
      color: #9d9d9d;
      transform: translate(50%, -50%);
      transition: top 0.22s cubic-bezier(0.2, 0.6, 0.2, 1),
        right 0.22s cubic-bezier(0.2, 0.6, 0.2, 1),
        transform 0.22s cubic-bezier(0.2, 0.6, 0.2, 1),
        color 0.12s ease;
    }

    .info-toggle:hover .info-chevron {
      color: #ededed;
    }

    .info.open .info-chevron {
      top: calc(var(--gutter) + var(--row) / 2);
      right: var(--gutter);
      transform: translate(0, -50%) rotate(180deg);
    }

    /* Too wide for the notch to hold, so it is faded rather than only clipped.
     A fixed height rather than a flex share, so the rows stack at the top of
     the open tray instead of spreading over its full height. */
    .info-row {
      flex: none;
      min-width: 0;
      height: var(--row);
      display: flex;
      align-items: center;
      gap: 1.6vmin;
      opacity: 0;
      transition: opacity 0.1s ease;
    }

    /* Rows the firmware has not reported yet. Spelled out because the display
     above outranks the one the `hidden` attribute carries. */
    .info-row[hidden] {
      display: none;
    }

    /* Only the top row shares its line with the chevron. */
    .info-row:first-child {
      padding-right: calc(var(--gutter) + 2 * var(--chev) + 1.6vmin);
    }

    .info.open .info-row {
      opacity: 1;
      transition-delay: 0.12s;
    }

    .info-label {
      flex: none;
      min-width: 11ch;
      font-size: 3.1vmin;
      color: #9d9d9d;
    }

    .info-value {
      min-width: 0;
      font-size: 3.6vmin;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Settings panel. Everything below shares the rows' grammar above: a muted
     label in a 7ch column, its control on the same line, and the same flat
     ground the tray is drawn on. */
    .info-gear {
      position: absolute;
      top: calc(var(--gutter) + var(--row) / 2);
      right: calc(var(--gutter) + var(--chev) + 1.6vmin);
      width: var(--chev);
      height: var(--chev);
      padding: 0;
      border: 0;
      background: transparent;
      color: #9d9d9d;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-50%);
      transition: opacity 0.1s ease, visibility 0.1s, color 0.12s ease;
    }

    .info.open .info-gear {
      opacity: 1;
      visibility: visible;
      transition-delay: 0.12s;
    }

    .info-gear:hover {
      color: #ededed;
    }

    .info-gear svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Settings panel. Its own thing, with none of the tray's geometry: it sits
     exactly over the device and fades in front of it. The 12.6% radius is the
     rx="63" of the 500-unit rounded square the device art is drawn on, and the
     box is square, so one percentage rounds both axes the same way.

     Translucent, so what it is covering stays legible behind it.

     --pad is not the tray's gutter: a corner that round eats into the box, and
     the largest rectangle inscribed in it starts 29.3% of the radius in, which
     works out at 3.7vmin here. That is where content would touch the curve, so
     the padding has to clear it rather than meet it. */
    .panel {
      --pad: 6vmin;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 74.07%;
      z-index: 3;
      display: flex;
      flex-direction: column;
      /* Its own rhythm rather than the tray's --gap, which is tuned for rows
       that are read at a glance rather than filled in. */
      gap: 2.4vmin;
      padding: var(--pad);
      border-radius: 12.6%;
      background: rgba(13, 12, 12, 0.86);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.18s ease, visibility 0.18s;
    }

    .panel.open {
      opacity: 1;
      visibility: visible;
    }

    /* Both name a device, and before the startup form is answered there is not
     one: the tray has nothing to report and the pin has nothing to reset. They
     arrive with the guest. */
    .panel.startup ~ .info,
    .panel.startup ~ .reset-pin {
      opacity: 0;
      pointer-events: none;
    }

    .opt {
      flex: none;
      min-width: 0;
      height: var(--row);
      display: flex;
      align-items: center;
      gap: 1.6vmin;
    }

    .opt-label {
      flex: none;
      min-width: 11ch;
      font-size: 3.1vmin;
      color: #9d9d9d;
    }

    /* The paragraph the panel opens with, and anything the launcher refused.
     Both wrap, so neither gets the rows' fixed height. */
    .panel-note,
    .panel-error {
      flex: none;
      font-size: 3.1vmin;
      line-height: 1.4;
      padding: 0.8vmin 0;
    }

    .panel-note {
      padding-bottom: 1.6vmin;
      color: #9d9d9d;
    }

    .panel-error {
      color: #f85149;
    }

    .opt-disk,
    .opt-memory {
      min-width: 0;
      padding: 0.5vmin 1.2vmin;
      border: 0.25vmin solid #282828;
      border-radius: 1vmin;
      background: #050505;
      color: #ededed;
      font: inherit;
      font-size: 3.6vmin;
    }

    .opt-disk {
      flex: 1;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    .opt-disk:hover {
      border-color: #9d9d9d;
    }

    .opt-memory {
      width: 10ch;
      text-align: right;
      user-select: text;
    }

    /* The spinner arrows are unreadable at this size and cannot be styled to
     match, so the field is typed into rather than nudged. */
    .opt-memory::-webkit-inner-spin-button {
      -webkit-appearance: none;
      appearance: none;
      margin: 0;
    }

    .opt-unit {
      font-size: 3.1vmin;
      color: #9d9d9d;
    }

    /* A square well the size of the text fields beside it, so the control
     column lines up, with the tick drawn inside rather than spelled out. */
    .opt-remember {
      flex: none;
      width: 5.8vmin;
      height: 5.8vmin;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0.25vmin solid #282828;
      border-radius: 1vmin;
      background: #050505;
      color: #ededed;
      cursor: pointer;
      transition: border-color 0.12s ease;
    }

    .opt-remember:hover {
      border-color: #9d9d9d;
    }

    .opt-remember svg {
      display: block;
      width: 72%;
      height: 72%;
      opacity: 0;
      transition: opacity 0.12s ease;
    }

    .opt-remember[aria-pressed='true'] svg {
      opacity: 1;
    }

    .opt-envs {
      flex: 1;
      min-width: 0;
      display: flex;
      gap: 0.6vmin;
    }

    .opt-env {
      flex: 1;
      min-width: 0;
      padding: 0.7vmin 0;
      border: 0;
      border-radius: 1vmin;
      background: #1c1c1c;
      color: #9d9d9d;
      font: inherit;
      font-size: 3.1vmin;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .opt-env[aria-pressed='true'] {
      background: #282828;
      color: #ededed;
    }

    /* Nothing the panel is showing is written until one of these is pressed,
     and which one decides whether it is written at all. The way out sits on
     the left and the way on at the right, with the middle reserved for the
     startup form's third answer.

     Sized from their own text rather than in equal shares: `save and start` is
     three times the width of `exit`, and thirds would clip it. */
    .opt-actions {
      flex: none;
      margin-top: auto;
      display: flex;
      gap: var(--gap);
    }

    .opt-cancel,
    .opt-start,
    .opt-confirm {
      flex: 1 1 auto;
      min-width: 0;
      white-space: nowrap;
      padding: 1.4vmin 0;
      border: 0;
      border-radius: 1.6vmin;
      font: inherit;
      font-size: 3.6vmin;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .opt-confirm {
      background: #282828;
      color: #ededed;
    }

    .opt-confirm:hover:not(:disabled) {
      background: #3a3a3a;
    }

    /* Outlined with an inset shadow rather than a border, so they keep the
     filled button's height instead of standing 0.5vmin taller. */
    .opt-cancel,
    .opt-start {
      background: transparent;
      box-shadow: inset 0 0 0 0.25vmin #282828;
    }

    /* Starting without saving is a real answer, not an escape, so it reads
     brighter than the way out beside it. */
    .opt-start {
      color: #ededed;
    }

    .opt-cancel {
      color: #9d9d9d;
    }

    .opt-cancel:hover:not(:disabled),
    .opt-start:hover:not(:disabled) {
      background: #1c1c1c;
      color: #ededed;
    }

    .opt-cancel:disabled,
    .opt-start:disabled,
    .opt-confirm:disabled {
      color: #9d9d9d;
      cursor: default;
    }
  </style>
</head>

<body>
  <div class="scene">
    <div class="device" data-tauri-drag-region>
      <img class="device-img" src="assets/dark_bio_vault.svg" alt="Ark device" data-tauri-drag-region />
      <span class="led tl" data-tauri-drag-region></span>
      <span class="led tr" data-tauri-drag-region></span>
      <span class="led bl" data-tauri-drag-region></span>
      <span class="led br" data-tauri-drag-region></span>
    </div>
    <div class="panel" data-tauri-drag-region>
      <span class="panel-note"></span>
      <span class="opt">
        <span class="opt-label"
          title="The file this emulator keeps everything in. Delete it to start over with a blank device.">storage</span>
        <button class="opt-disk" type="button"></button>
      </span>
      <span class="opt">
        <span class="opt-label"
          title="Next time, start this emulator straight away instead of asking again.">autostart</span>
        <button class="opt-remember" type="button" aria-pressed="true" aria-label="autostart">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3.2 8.4L6.4 11.6L12.8 4.6" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </span>
      <span class="opt">
        <span class="opt-label" title="How much memory to give this emulator.">memory</span>
        <input class="opt-memory" type="number" inputmode="numeric" step="256" aria-label="memory" />
        <span class="opt-unit">MiB</span>
      </span>
      <span class="opt">
        <span class="opt-label"
          title="Which Dark Bio service this device talks to. It is fixed when a device is created, so a change here applies to the next new one.">environment</span>
        <span class="opt-envs"></span>
      </span>
      <span class="panel-error" role="alert"></span>
      <span class="opt-actions">
        <button class="opt-cancel" type="button"></button>
        <button class="opt-start" type="button" hidden>start</button>
        <button class="opt-confirm" type="button"></button>
      </span>
    </div>
    <div class="info">
      <button class="info-toggle" type="button" aria-label="device info" aria-expanded="false">
        <span class="info-row" data-row="disk">
          <span class="info-label">storage</span>
          <span class="info-value"></span>
        </span>
        <span class="info-row" data-row="name" hidden>
          <span class="info-label">name</span>
          <span class="info-value"></span>
        </span>
        <span class="info-row" data-row="serial" hidden>
          <span class="info-label">serial</span>
          <span class="info-value"></span>
        </span>
        <span class="info-row" data-row="expires" hidden>
          <span class="info-label">expires</span>
          <span class="info-value"></span>
        </span>
        <span class="info-row" data-row="env" hidden>
          <span class="info-label">environment</span>
          <span class="info-value"></span>
        </span>
        <svg class="info-chevron" viewBox="0 0 12 7" fill="none" aria-hidden="true">
          <path d="M1 1L6 6L11 1" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </button>
      <button class="info-gear" type="button" aria-label="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor"
            d="M19.14 12.94a7.6 7.6 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.3 7.3 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.65 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.6 7.6 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.12.22.39.3.61.22l2.39-.96c.49.38 1.03.7 1.62.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.49 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.6a3.6 3.6 0 1 1 0-7.2a3.6 3.6 0 0 1 0 7.2Z" />
        </svg>
      </button>
    </div>
    <button class="reset-pin" type="button" aria-label="reset button">
      <img src="assets/sim_removal_tool.svg" alt="" />
    </button>
  </div>
  <script type="module">
    import { startBootAnimation } from './boot_anim.js';
    import { mountSettings } from './settings.js';

    // Identity of the emulated device, pushed by the firmware once it has
    // booted and again whenever a claim changes, such as a rename or an
    // onboarding. Frames are partial, so this is the accumulated picture rather
    // than a copy of the last one. The socket below fills it in and the info
    // tray draws it, so it is parked here between the two. Held rather than
    // asked for on demand, since the tray can be opened long before the
    // firmware is far enough along to answer.
    const deviceInfo = { known: false, env: null, name: null, serial: null, expiry: null };
    let onDeviceInfo = () => { };

    // Starts the local boot animation. Assigned by the hardware channel below,
    // and called once there is a guest behind the device face, which is not
    // necessarily when the page loads: the settings panel can still be gating
    // the start.
    let startBootLeds = () => { };

    // Hardware channel: driver frames stream in from the firmware, reset-pin
    // edges go out. Every /v1/hw message is wrapped in the bus envelope
    //   { "d": "<driver>", "id": "<instance>", "payload": { ... } }
    // Recognised tags are handled below; anything else is ignored.
    (() => {
      const pin = document.querySelector('.reset-pin');
      const leds = [
        document.querySelector('.led.bl'),
        document.querySelector('.led.tl'),
        document.querySelector('.led.tr'),
        document.querySelector('.led.br'),
      ];

      // Address of the /v1/hw bus, injected by the launcher before this script
      // runs so the UI follows --host-addr. Falls back to the default for
      // running the UI outside the launcher.
      const HW_ADDR = window.__HW_ADDR__ ?? '127.0.0.1:18181';

      // GPIO id the firmware watches for reset-button edges, paired with the
      // carrier identity advertised below.
      const BUTTON_PIN_ID = '5';

      // GPIO id the firmware drives high once it has taken over the LEDs from
      // its own boot sequence. Until we see this, the UI runs a local boot
      // animation; after, it displays the colours streamed over /v1/hw.
      const LED_SWITCH_PIN_ID = '22';

      // Carrier identity the UI advertises when the firmware reads it at boot.
      // Could be made configurable later to exercise other carriers.
      const CARRIER_VERSION = 1;
      const CARRIER_REVISION = 11;

      // The wire carries raw sRGB floats out of the firmware (no clamping, no
      // 0..255 quantization). The real device's LEDs are typically driven at
      // ~10% of their max to look comfortably bright, so we boost 10x and
      // scale to 0..255 for CSS: BRIGHTNESS = 10 * 255 = 2550. When a
      // channel would clip past 255 the colour saturates and the excess grows
      // the glow proportionally (e.g. 250% peak -> 2.5x blur + spread), so an
      // overdriven LED looks roughly the way it would on hardware.
      const BRIGHTNESS = 10 * 255;
      const GLOW_BLUR = 0.6;   // vmin, at 100% brightness
      const GLOW_SPREAD = 0.1; // vmin, at 100% brightness

      function applyLeds(colors) {
        for (let i = 0; i < 4; i++) {
          const [r0, g0, b0] = colors[i] || [0, 0, 0];
          const rScaled = r0 * BRIGHTNESS, gScaled = g0 * BRIGHTNESS, bScaled = b0 * BRIGHTNESS;
          const peak = Math.max(rScaled, gScaled, bScaled);
          const overflow = peak > 255 ? peak / 255 : 1;
          const r = Math.min(255, rScaled);
          const g = Math.min(255, gScaled);
          const b = Math.min(255, bScaled);
          leds[i].style.background = `rgb(${r}, ${g}, ${b})`;
          leds[i].style.boxShadow =
            `0 0 ${GLOW_BLUR * overflow}vmin ${GLOW_SPREAD * overflow}vmin ` +
            `rgba(${r}, ${g}, ${b}, 0.55)`;
        }
      }

      // Local boot animation runs until the firmware signals (via the led
      // switch GPIO) that it has taken over the LEDs. Routes through applyLeds
      // so the brightness/glow look matches firmware-driven frames. Restarted
      // whenever the /v1/hw socket drops, which is our proxy for "firmware just
      // rebooted". Covers clean reboots, crashes, and firmware process
      // respawns equally, since none of them get to send a graceful signal
      // first.
      //
      // It does not start on its own. The window can be on screen with the
      // settings panel up and nothing booted behind it, and LEDs running a boot
      // sequence for a device nobody has started yet would be a lie.
      let bootMode = true;
      let bootCtrl = null;
      startBootLeds = () => {
        if (!bootCtrl) bootCtrl = startBootAnimation(applyLeds);
      };

      let ws = null;
      function connect() {
        ws = new WebSocket(`ws://${HW_ADDR}/v1/hw`);
        ws.onmessage = ev => {
          try {
            const env = JSON.parse(ev.data);
            if (env.d === 'rgbled' && Array.isArray(env.payload?.colors)) {
              // Ignore firmware LED frames until the led switch flips; the
              // local boot animation owns the display until then.
              if (!bootMode) applyLeds(env.payload.colors);
            } else if (
              env.d === 'switch' &&
              env.id === LED_SWITCH_PIN_ID &&
              env.payload?.level === 'high'
            ) {
              bootMode = false;
              bootCtrl?.stop();
            } else if (env.d === 'revbits' && env.payload?.op === 'read') {
              // Firmware is asking what carrier it's running on; reply on
              // the same (driver, instance) key with our configured identity.
              ws.send(JSON.stringify({
                d: 'revbits',
                id: env.id,
                payload: { version: CARRIER_VERSION, revision: CARRIER_REVISION },
              }));
            } else if (env.d === 'nameplate') {
              // A frame carries only the claims that changed, so merge it
              // in rather than replacing: a claim it leaves out keeps the
              // value it already has.
              const claims = env.payload ?? {};
              for (const claim of ['env', 'name', 'serial', 'expiry']) {
                if (Object.hasOwn(claims, claim)) {
                  deviceInfo[claim] = claims[claim] ?? null;
                }
              }
              deviceInfo.known = true;
              onDeviceInfo();
              // The launcher publishes this device to the registry that lets
              // other tools find it, and this socket is the only place the
              // claims arrive. Its first arrival is also what tells the
              // launcher the firmware is up: the guest accepts no other client
              // until this bus has a peer.
              window.__TAURI__?.core.invoke('nameplate', claims).catch(() => { });
            }
            // Unrecognised driver tags no-op.
          } catch { }
        };
        ws.onclose = () => {
          ws = null;
          // Treat a dropped /v1/hw socket as "firmware is rebooting": flip back
          // into bootMode so firmware LED frames are ignored again, and kick
          // off a fresh local animation. Guarded so the no-op case (initial
          // connection refused while still in bootMode) doesn't stack
          // animations.
          if (!bootMode) {
            bootMode = true;
            bootCtrl = startBootAnimation(applyLeds);
          }
          setTimeout(connect, 1000);
        };
        ws.onerror = () => { try { ws.close(); } catch { } };
      }
      connect();

      function sendButton(edge) {
        if (ws && ws.readyState === 1) {
          ws.send(JSON.stringify({ d: 'button', id: BUTTON_PIN_ID, payload: { edge } }));
        }
      }

      // Pointer capture keeps the press "sticky" -- once the user mousedowns
      // on the pin, the .pressed state (and the firmware's view of the button)
      // stays until mouseup anywhere, even if the cursor leaves the moving
      // hitbox. `pressed` guards against duplicate edges from pointerup +
      // pointercancel firing on the same release.
      let pressed = false;
      pin.addEventListener('pointerdown', e => {
        pin.setPointerCapture(e.pointerId);
        pin.classList.add('pressed');
        if (!pressed) {
          pressed = true;
          sendButton('falling');
        }
      });
      const release = () => {
        pin.classList.remove('pressed');
        if (pressed) {
          pressed = false;
          sendButton('rising');
        }
      };
      pin.addEventListener('pointerup', release);
      pin.addEventListener('pointercancel', release);
    })();

    // Info tray: a notch on the device's bottom edge that opens into a strip
    // naming what the emulated device is running on. The disk path is fetched
    // on first open rather than at load, since there is none to name until the
    // guest has been started, which the settings panel may still be asking
    // about, and again on a start for the same reason.
    (() => {
      const tray = document.querySelector('.info');
      const rows = {};
      for (const row of tray.querySelectorAll('.info-row')) {
        rows[row.dataset.row] = { row, value: row.querySelector('.info-value') };
      }
      let loaded = false;

      async function loadDisk() {
        if (loaded) return;
        let path = null;
        try {
          path = await window.__TAURI__?.core.invoke('disk_path');
        } catch { }
        if (!path) {
          rows.disk.value.textContent = 'unknown';
          return;
        }
        loaded = true;
        rows.disk.value.textContent = path.split(/[\\/]/).pop();
        rows.disk.value.title = path;
      }

      // How much of the identity's validity is left, coarsened the way every
      // other face of the device words it. Only the order of magnitude matters
      // at a glance, so the date it actually lands on is left to the tooltip.
      function expiresIn(expiry) {
        const left = expiry * 1000 - Date.now();
        if (left <= 0) return 'expired';
        const days = Math.floor(left / 86_400_000);
        if (days >= 2) return `${days} days`;
        const hours = Math.floor(left / 3_600_000);
        if (hours >= 2) return `${hours} hours`;
        const minutes = Math.floor(left / 60_000);
        return minutes >= 2 ? `${minutes} minutes` : '1 minute';
      }

      // The tray is sized from the number of rows it ends up showing, so this
      // runs after anything that reveals or hides one.
      function syncRows() {
        tray.style.setProperty(
          '--rows', tray.querySelectorAll('.info-row:not([hidden])').length);
      }

      // The device rows stay hidden until the firmware sends a nameplate, so
      // a firmware that never sends one leaves an honest single row rather than
      // placeholders waiting forever. A device that was never onboarded carries
      // no trusted claims, hence no serial and no expiry to show, and one the
      // user has not named yet has no name.
      function renderDevice() {
        if (!deviceInfo.known) return;
        // An empty name is one the user cleared, which reads the same as
        // never having set one.
        rows.name.row.hidden = !deviceInfo.name;
        if (deviceInfo.name) {
          rows.name.value.textContent = deviceInfo.name;
        }
        rows.serial.row.hidden = false;
        rows.serial.value.textContent = deviceInfo.serial || 'not onboarded';
        rows.expires.row.hidden = deviceInfo.expiry === null;
        if (deviceInfo.expiry !== null) {
          rows.expires.value.textContent = expiresIn(deviceInfo.expiry);
          rows.expires.value.title = new Date(deviceInfo.expiry * 1000).toLocaleString();
        }
        rows.env.row.hidden = deviceInfo.env === null;
        if (deviceInfo.env !== null) {
          rows.env.value.textContent = deviceInfo.env;
        }
        syncRows();
      }
      onDeviceInfo = renderDevice;

      const toggle = tray.querySelector('.info-toggle');
      toggle.addEventListener('click', () => {
        const open = tray.classList.toggle('open');
        toggle.setAttribute('aria-expanded', String(open));
        // Redrawn on every open so the countdown is current. A timer would keep
        // it current while the tray is shut, which nobody can see.
        if (open) {
          loadDisk();
          renderDevice();
        }
      });

      mountSettings({
        panel: document.querySelector('.panel'),
        gear: tray.querySelector('.info-gear'),
        onGuest: () => {
          loadDisk();
          startBootLeds();
        },
      });
    })();

    // Window drag is handled natively by Tauri via the `data-tauri-drag-region`
    // attribute on .device (and its children) and on .panel, which only carries
    // it on its own background, so its controls stay clickable. No JS plumbing
    // needed.

    // Escape closes the window. No window chrome means no X button; this is
    // the in-app way out. Alt+F4 / WM shortcuts still work.
    window.addEventListener('keydown', e => {
      if (e.key === 'Escape' && window.__TAURI__) {
        window.__TAURI__.window.getCurrentWindow().close();
      }
    });
  </script>
</body>

</html>
