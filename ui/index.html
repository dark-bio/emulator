<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ark I emulator</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1117;
    --led: #2ea043;
    --pad: 4vmin;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    /* Windowless: the launcher's window itself is transparent, so the body
       must paint nothing. Only the device + LEDs + pin appear on the desktop. */
    background: transparent;
    color: #c9d1d9;
    font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--pad);
  }

  /* Scene: a 220:286 box sized to fit the largest area available inside the
     body's padding box, keeping aspect ratio. Sized via the smaller of the
     two viewport-derived constraints so it never overflows. */
  .scene {
    --aspect-w: 220;
    --aspect-h: 286;
    width: min(
      calc(100vw - 2 * var(--pad)),
      calc((100vh - 2 * var(--pad)) * var(--aspect-w) / var(--aspect-h))
    );
    aspect-ratio: var(--aspect-w) / var(--aspect-h);
    position: relative;
  }

  /* Device fills the top portion of the scene (220/286 ≈ 76.9% of height). */
  .device {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    z-index: 2;
  }
  .device-img {
    display: block;
    width: 100%;
    height: 100%;
    -webkit-user-drag: none;
    user-select: none;
  }

  /* LED dots: 9/220 = 4.09% across; 23/220 = 10.45% from each corner edge.
     Box is square (aspect 1:1) so a single percentage works for both axes. */
  .led {
    position: absolute;
    width: 4.09%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: var(--led);
    box-shadow: 0 0 0.6vmin 0.1vmin rgba(46, 160, 67, 0.55);
  }
  .led.tl { top: 10.45%; left: 10.45%; }
  .led.tr { top: 10.45%; right: 10.45%; }
  .led.bl { bottom: 10.45%; left: 10.45%; }
  .led.br { bottom: 10.45%; right: 10.45%; }

  /* Reset pin. All measurements as a fraction of .scene's 220x286 box.
     - width: 18/220 = 8.18% of scene width
     - height: 54/286 = 18.88% of scene height
     - top: 220/286 = 76.92% (device's bottom edge)
     - right: 18/220 = 8.18% (mirrors the companion app's 42-of-500 offset)
     translateY uses pin's own height as 100%:
     - default: +10/54 = +18.5%  (gap below device)
     - hover  : +4/54  = +7.4%
     - active : -15%              (slides under the device; softer than the
                                   companion's reference for a less abrupt feel) */
  .reset-pin {
    position: absolute;
    top: 76.92%;
    right: 8.18%;
    width: 8.18%;
    height: 18.88%;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    z-index: 1;
    transform: translateY(18.5%);
    transition: transform 0.16s cubic-bezier(0.2, 0.6, 0.2, 1);
  }
  .reset-pin:hover   { transform: translateY(7.4%); }
  /* .pressed wins over :hover (later, same specificity) so the cursor leaving
     the moving hitbox doesn't pop the press state back to hover. */
  .reset-pin.pressed { transform: translateY(-15%); }
  .reset-pin:focus-visible {
    outline: 2px solid #58a6ff;
    outline-offset: 2px;
    border-radius: 4px;
  }
  .reset-pin img {
    display: block;
    width: 100%;
    height: 100%;
    pointer-events: none;
    -webkit-user-drag: none;
    user-select: none;
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="device">
      <img class="device-img" src="assets/dark_bio_vault.svg" alt="Ark device" />
      <span class="led tl"></span>
      <span class="led tr"></span>
      <span class="led bl"></span>
      <span class="led br"></span>
    </div>
    <button class="reset-pin" type="button" aria-label="reset button">
      <img src="assets/sim_removal_tool.svg" alt="" />
    </button>
  </div>
<script>
  // Pointer capture keeps the press "sticky" -- once the user mousedowns on
  // the pin, the .pressed state stays until mouseup anywhere, even if the
  // cursor leaves the (now-moved) hitbox. Without this, the pin springs back
  // as soon as its translated position slides out from under the cursor.
  (() => {
    const pin = document.querySelector('.reset-pin');
    pin.addEventListener('pointerdown', e => {
      pin.setPointerCapture(e.pointerId);
      pin.classList.add('pressed');
    });
    const release = () => pin.classList.remove('pressed');
    pin.addEventListener('pointerup', release);
    pin.addEventListener('pointercancel', release);
  })();

  // Drag the entire (chromeless) window by mousing down on the device. We
  // implement the drag in JS rather than handing off to the WM's native
  // move-drag, because that API needs the originating button event's
  // timestamp/serial -- which our IPC hop drops, making it work only every
  // other attempt.
  //
  // Math: on pointerdown, the launcher snapshots its current outer position.
  // On each pointermove we send the cursor's delta in CSS pixels from the
  // pointerdown position, and the launcher applies it to the snapshot. This
  // avoids any assumption about how cursor-in-window coords relate to the
  // window's outer position (they can differ by a constant on GTK).
  //
  // The pointermove fires faster than the WM can apply position updates, so
  // we coalesce multiple events between animation frames into one IPC call --
  // avoids piling up updates and the visible jitter that causes.
  (() => {
    const device = document.querySelector('.device');
    let pressScreen = null;
    let pointerId = null;
    let pending = null;
    let scheduled = false;

    const flush = () => {
      scheduled = false;
      if (pending && window.ipc && window.ipc.postMessage) {
        window.ipc.postMessage(`drag-by:${pending.dx},${pending.dy}`);
        pending = null;
      }
    };

    device.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      pressScreen = { x: e.screenX, y: e.screenY };
      pointerId = e.pointerId;
      device.setPointerCapture(pointerId);
      if (window.ipc && window.ipc.postMessage) {
        window.ipc.postMessage('drag-start');
      }
    });

    device.addEventListener('pointermove', e => {
      if (e.pointerId !== pointerId || pressScreen === null) return;
      pending = {
        dx: e.screenX - pressScreen.x,
        dy: e.screenY - pressScreen.y,
      };
      if (!scheduled) {
        scheduled = true;
        requestAnimationFrame(flush);
      }
    });

    const stop = e => {
      if (e.pointerId === pointerId) {
        pressScreen = null;
        pointerId = null;
        pending = null;
      }
    };
    device.addEventListener('pointerup', stop);
    device.addEventListener('pointercancel', stop);
    device.addEventListener('lostpointercapture', stop);
  })();
</script>
</body>
</html>
