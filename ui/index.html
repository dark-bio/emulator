<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ark emulator</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1117;
    --fg: #c9d1d9;
    --muted: #6e7681;
    --accent: #58a6ff;
    --ok: #7ee787;
    --bad: #f85149;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
    height: 100vh;
  }
  /* The window itself is the enclosure -- no inner chrome, just layout. */
  .panel {
    box-sizing: border-box;
    height: 100%;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .name { font-weight: 600; font-size: 13px; letter-spacing: 0.04em; }
  .badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    background: #21262d;
    color: var(--muted);
  }
  .badge.ok  { color: var(--ok); }
  .badge.bad { color: var(--bad); }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 0;
  }
  .label { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }

  /* The toggle switch. Two labeled halves, the active one highlighted. */
  .switch {
    display: inline-flex;
    border: 1px solid #30363d;
    border-radius: 6px;
    overflow: hidden;
    user-select: none;
  }
  .switch button {
    background: transparent;
    color: var(--muted);
    border: none;
    padding: 6px 14px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.08s, color 0.08s;
  }
  .switch button:not(.active):hover { color: var(--fg); }
  .switch button.active {
    background: var(--accent);
    color: #0d1117;
    font-weight: 600;
  }

  .footer {
    margin-top: auto;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="head">
      <span class="name">ARK I · EMULATOR</span>
      <span id="status" class="badge">connecting...</span>
    </div>

    <div class="row">
      <span class="label">case</span>
      <div class="switch" role="group" aria-label="case mode">
        <button id="upper" class="active" type="button">UPPER</button>
        <button id="lower" type="button">lower</button>
      </div>
    </div>

    <div class="footer">
      Controls firmware-side hardware state. The dashboard sees the effect on
      its next echoed reply.
    </div>
  </div>

<script>
  // The emulator's hardware-channel WS. Defaults to the firmware's /hw endpoint
  // on the launcher's default address; override with ?bridge=...
  const params = new URLSearchParams(location.search);
  const wsUrl = params.get("bridge") || "ws://127.0.0.1:8080/hw";

  const status = document.getElementById("status");
  const upper = document.getElementById("upper");
  const lower = document.getElementById("lower");

  function setStatus(text, cls) {
    status.textContent = text;
    status.className = "badge " + (cls || "");
  }

  function setSwitch(which) {
    upper.classList.toggle("active", which === "upper");
    lower.classList.toggle("active", which === "lower");
  }

  let ws;
  function connect() {
    ws = new WebSocket(wsUrl);

    ws.onopen = () => {
      setStatus("connected", "ok");
      upper.disabled = false;
      lower.disabled = false;
    };
    ws.onclose = () => {
      setStatus("disconnected", "bad");
      upper.disabled = true;
      lower.disabled = true;
      setTimeout(connect, 1000);
    };
    ws.onerror = () => setStatus("error", "bad");
    ws.onmessage = (ev) => {
      const v = String(ev.data).trim();
      if (v === "upper" || v === "lower") setSwitch(v);
    };
  }

  function send(which) {
    if (ws && ws.readyState === 1) {
      ws.send(which);
      setSwitch(which); // optimistic; firmware will confirm on next connect
    }
  }

  upper.addEventListener("click", () => send("upper"));
  lower.addEventListener("click", () => send("lower"));

  connect();
</script>
</body>
</html>
