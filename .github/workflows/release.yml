name: release

# Builds installers for macOS (arm64 + x86_64), Windows, and Linux, and
# attaches them to a GitHub Release. Each platform builds natively (no
# cross-compilation) and bundles its own QEMU plus the pinned firmware
# release for its own host architecture only, not both guest architectures
# (see .github/scripts/fetch-qemu-*), so the resulting installers work
# standalone with nothing to install, and stay smaller. The firmware fetch
# runs per job rather than once shared, since which architecture's release
# assets it needs now depends on each job's own host.
#
# Also produces a no-install artifact per platform: the AppImage on Linux,
# the raw .app on macOS, and a hand-assembled portable .zip on Windows
# (NSIS has no portable mode; Tauri gives no other way to get one).
on:
  push:
    tags:
      - "v*.*.*"

env:
  # Not secret: a bare version number doesn't reveal which repo it names.
  # See .github/scripts/fetch-firmware.sh for why the repo path itself
  # (FIRMWARE_REPO, below) comes from a secret instead.
  FIRMWARE_TAG: "v0.11.4"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
            bundles: dmg,app
          - os: macos-26-intel
            arch: amd64
            bundles: dmg,app
          - os: windows-2022
            arch: amd64
            bundles: nsis
          - os: ubuntu-22.04
            arch: amd64
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            qemu-system-arm qemu-system-x86 qemu-utils

      - name: Fetch bundled QEMU (Linux)
        if: runner.os == 'Linux'
        run: .github/scripts/fetch-qemu-linux.sh

      - name: Fetch bundled QEMU (macOS)
        if: runner.os == 'macOS'
        run: .github/scripts/fetch-qemu-macos.sh

      - name: Fetch bundled QEMU (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/fetch-qemu-windows.ps1

      - name: Fetch pinned firmware release
        # shell: bash is GitHub Actions' own documented cross-platform
        # option: on Windows it runs via the Git for Windows bash already on
        # the runner, the same interpreter fetch-firmware.sh needs, so one
        # step covers all three OSes without a pwsh wrapper subprocess.
        shell: bash
        env:
          FIRMWARE_REPO: ${{ secrets.FIRMWARE_REPO }}
          GH_TOKEN: ${{ secrets.FIRMWARE_RELEASES_TOKEN }}
        run: .github/scripts/fetch-firmware.sh

      - name: Build
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Zip portable macOS app
        # ditto (not zip -r) is Apple's recommended way to archive a .app:
        # plain zip can mangle extended attributes and resource forks.
        # --keepParent so extracting drops a plain "Ark Emulator.app", not
        # its contents loose in the current directory. Named generically
        # here; the final release-asset name is assigned in "Stage
        # artifacts" below.
        if: runner.os == 'macOS'
        run: |
          app="$(find target/release/bundle/macos -maxdepth 1 -name '*.app')"
          ditto -c -k --sequesterRsrc --keepParent "$app" \
            "target/release/bundle/macos/Ark-Emulator.app.zip"

      - name: Build portable Windows zip
        # Tauri's own resource staging only happens inside the NSIS
        # installer's payload, not as a loose directory on disk, so this
        # reassembles the same flat layout by hand: main exe + sidecar exes
        # + qemu-libs/firmware all as siblings, which is what a real install
        # produces too (confirmed by the launcher's own runtime logging) and
        # what BaseDirectory::Resource resolves relative to current_exe()
        # regardless of whether the app was installed or just unzipped.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $portableDir = "target/release/portable/Ark Emulator"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item "target/release/launcher.exe" (Join-Path $portableDir "Ark Emulator.exe")
          Copy-Item "target/release/qemu-system-guest.exe" $portableDir
          Copy-Item "target/release/qemu-img.exe" $portableDir
          Copy-Item "launcher/qemu-libs" (Join-Path $portableDir "qemu-libs") -Recurse
          Copy-Item "launcher/firmware" (Join-Path $portableDir "firmware") -Recurse
          # Named generically; the final release-asset name is assigned in
          # "Stage artifacts" below.
          Compress-Archive -Path $portableDir `
            -DestinationPath "target/release/portable/Ark-Emulator-portable.zip"

      - name: Stage artifacts
        # actions/upload-artifact computes the least common ancestor across
        # every line of a multi-pattern `path:` and preserves the directory
        # structure below it, so pointing it straight at bundle/dmg/,
        # bundle/deb/, etc. produces an artifact with deb/ and appimage/ as
        # actual subdirectories rather than flat files -- gh release create
        # then tries to upload a directory as an asset and fails. Staging
        # everything flat here first sidesteps that entirely.
        #
        # Also assigns the final release-asset name here, consistently
        # across every artifact on every platform:
        # ark-emulator-{version}-{os}-{arch}.{ext}, os one of
        # linux/macos/windows, arch one of amd64/arm64. nullglob so a
        # pattern that doesn't apply to this OS (e.g. *.dmg on Linux) just
        # contributes nothing instead of erroring under -e.
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          shopt -s nullglob
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          os_name="$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
          prefix="dist/ark-emulator-${version}-${os_name}-${ARCH}"

          for f in target/release/bundle/dmg/*.dmg; do cp "$f" "${prefix}.dmg"; done
          for f in target/release/bundle/macos/*.app.zip; do cp "$f" "${prefix}.app.zip"; done
          for f in target/release/bundle/nsis/*.exe; do cp "$f" "${prefix}.exe"; done
          for f in target/release/portable/*.zip; do cp "$f" "${prefix}.zip"; done
          for f in target/release/bundle/deb/*.deb; do cp "$f" "${prefix}.deb"; done
          for f in target/release/bundle/appimage/*.AppImage; do cp "$f" "${prefix}.AppImage"; done

          ls -la dist/

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --generate-notes
