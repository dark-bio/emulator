name: Build and Smoke Test (PR, Push)

# Compiles and smoke tests every platform on each push to a pull request, so a
# broken build or a portable artifact that will not launch is caught before a tag
# exists. The pipeline itself lives in build.yml, which release.yml calls too.
on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Four native builds plus four emulated boots is expensive enough that
# superseded runs are not worth finishing.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
