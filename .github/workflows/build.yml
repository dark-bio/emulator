name: Build and Smoke Test (Reusable)

# Builds installers for macOS (arm64 + x86_64), Windows, and Linux, then smoke
# tests the no-install artifact of each on a clean machine. Called by
# build-and-smoke.yml on pull requests and by release.yml on tags, so a release
# cannot ship a portable build that fails to launch.
#
# Each platform builds natively and bundles QEMU and firmware for its own host
# architecture only (see .github/scripts/qemu-common.sh), so both fetches run
# per job rather than once shared.
#
# The no-install artifact is the AppImage on Linux, the raw .app on macOS, and a
# hand-assembled portable .zip on Windows: NSIS has no portable mode, and Tauri
# gives no other way to get one.
on:
  workflow_call:

env:
  # Firmware images are published to the public dark-bio/emulator-images repo
  # (see fetch-firmware.sh); bumping the bundled firmware is updating this value.
  FIRMWARE_TAG: "v0.11.4"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
            bundles: dmg,app
          - os: macos-26-intel
            arch: amd64
            bundles: dmg,app
          - os: windows-2022
            arch: amd64
            bundles: nsis
          - os: ubuntu-22.04
            arch: amd64
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        # Skipped on tags so a release always builds from scratch.
        if: github.ref_type != 'tag'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Cache tauri-cli
        # Swatinem/rust-cache covers the target directory and the registry but
        # not ~/.cargo/bin, so tauri-cli would otherwise be compiled from source
        # on all four runners every run. A restored cache pins the tool at
        # whatever 2.x it was populated with, since any of them satisfies "^2";
        # tags skip this cache, so a release is never built by a stale one.
        if: github.ref_type != 'tag'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: ${{ runner.os }}-${{ runner.arch }}-tauri-cli-v2

      - name: Install tauri-cli
        # Exits successfully and near-instantly when the version is already
        # present, so this doubles as the cache-miss path.
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            qemu-system-x86 qemu-utils ipxe-qemu

      - name: Fetch bundled QEMU (Linux)
        if: runner.os == 'Linux'
        run: .github/scripts/fetch-qemu-linux.sh

      - name: Fetch bundled QEMU (macOS)
        if: runner.os == 'macOS'
        run: .github/scripts/fetch-qemu-macos.sh

      - name: Fetch bundled QEMU (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/fetch-qemu-windows.ps1

      - name: Fetch pinned firmware release
        # shell: bash is GitHub Actions' own documented cross-platform option:
        # on Windows it runs via the Git for Windows bash already on the runner,
        # so one step covers all three OSes without a pwsh wrapper subprocess.
        #
        # dark-bio/emulator-images is public, so no secret is needed; the
        # ambient GITHUB_TOKEN is only for the API rate limit.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/fetch-firmware.sh

      - name: Build
        # tauri.release.conf.json adds the bundled QEMU/firmware to the base
        # config (JSON merge patch, so it only adds those keys). They're kept
        # out of tauri.conf.json because tauri-build validates externalBin paths
        # and resource globs on every cargo invocation, which would make a plain
        # `cargo run` from a fresh clone fail until the fetch scripts had run.
        run: cargo tauri build --config launcher/tauri.release.conf.json --bundles ${{ matrix.bundles }}

      - name: Verify macOS signature
        # The per-dylib loop is not redundant with --deep: codesign seals a loose
        # .dylib under Resources/ as data rather than as nested code, so --deep
        # alone reports a bundle full of unsigned libraries as valid. The two
        # --display calls are logging, not assertions.
        #
        # spctl is the real Gatekeeper verdict and is expected to reject an
        # ad-hoc build, so it is reported rather than enforced. It is the one
        # check here that flips to green once a Developer ID identity and
        # notarization credentials exist.
        if: runner.os == 'macOS'
        run: |
          app="$(find target/release/bundle/macos -maxdepth 1 -name '*.app')"
          codesign --verify --deep --strict --verbose=2 "$app"
          for lib in "$app/Contents/Resources/qemu-libs"/*.dylib; do
            codesign --verify --strict "$lib"
          done
          codesign --display --entitlements - "$app"
          codesign --display --entitlements - "$app/Contents/MacOS/qemu-system-guest"
          spctl --assess --type exec --verbose=4 "$app" \
            || echo "not accepted by Gatekeeper: ad-hoc signed, not notarized"

      - name: Zip portable macOS app
        # ditto (not zip -r) is Apple's recommended way to archive a .app: plain
        # zip can mangle extended attributes and resource forks. --keepParent so
        # extracting drops a plain "Ark Emulator.app", not its contents loose in
        # the current directory.
        if: runner.os == 'macOS'
        run: |
          app="$(find target/release/bundle/macos -maxdepth 1 -name '*.app')"
          ditto -c -k --sequesterRsrc --keepParent "$app" \
            "target/release/bundle/macos/Ark-Emulator.app.zip"

      - name: Build portable Windows zip
        # Tauri's resource staging only happens inside the NSIS installer's
        # payload, not as a loose directory on disk, so this reassembles the same
        # flat layout by hand: main exe + sidecar exes + qemu-libs/firmware as
        # siblings, matching both a real install and what BaseDirectory::Resource
        # resolves relative to current_exe().
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $portableDir = "target/release/portable/Ark Emulator"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item "target/release/launcher.exe" (Join-Path $portableDir "Ark Emulator.exe")
          Copy-Item "target/release/qemu-system-guest.exe" $portableDir
          Copy-Item "target/release/qemu-img.exe" $portableDir
          Copy-Item "launcher/qemu-libs" (Join-Path $portableDir "qemu-libs") -Recurse
          Copy-Item "launcher/firmware" (Join-Path $portableDir "firmware") -Recurse
          Compress-Archive -Path $portableDir `
            -DestinationPath "target/release/portable/Ark-Emulator-portable.zip"

      - name: Stage artifacts
        # actions/upload-artifact computes the least common ancestor across every
        # line of a multi-pattern `path:` and preserves the directory structure
        # below it, so pointing it straight at bundle/dmg/, bundle/deb/, etc.
        # produces an artifact with those as real subdirectories. gh release
        # create then tries to upload a directory as an asset and fails. Staging
        # everything flat here sidesteps that.
        #
        # This is also where every artifact gets its final release-asset name,
        # ark-emulator-{version}-{os}-{arch}.{ext}. Only a tag carries a version,
        # and GITHUB_REF_NAME is a "<pr>/merge" path fragment on a pull request,
        # so anything else is named after its commit. nullglob so a pattern that
        # doesn't apply to this OS contributes nothing instead of erroring.
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          shopt -s nullglob
          mkdir -p dist
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${GITHUB_SHA:0:7}"
          fi
          os_name="$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
          prefix="dist/ark-emulator-${version}-${os_name}-${ARCH}"

          for f in target/release/bundle/dmg/*.dmg; do cp "$f" "${prefix}.dmg"; done
          for f in target/release/bundle/macos/*.app.zip; do cp "$f" "${prefix}.zip"; done
          for f in target/release/bundle/nsis/*.exe; do cp "$f" "${prefix}.exe"; done
          for f in target/release/portable/*.zip; do cp "$f" "${prefix}.zip"; done
          for f in target/release/bundle/deb/*.deb; do cp "$f" "${prefix}.deb"; done
          for f in target/release/bundle/appimage/*.AppImage; do cp "$f" "${prefix}.AppImage"; done

          ls -la dist/

      - name: Generate checksums
        shell: bash
        run: .github/scripts/checksums.sh dist

      - name: Upload installers
        # Uploaded on every run, not just tags: the smoke job downloads these
        # rather than rebuilding, so the artifact it tests is bit-for-bit the one
        # a release would publish.
        uses: actions/upload-artifact@v6
        with:
          name: installers-${{ matrix.os }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  # Launches each platform's no-install artifact on a runner that never had the
  # build job's dependencies installed on it. The build job apt-installs QEMU and
  # webkit and brew-installs QEMU, so it is the wrong machine to test the
  # "nothing to install" claim on; a fresh runner per leg is the point. No flags
  # are passed to the launcher, so this is a user's first launch: bundled
  # firmware, an empty app data directory, and a qcow2 created from scratch.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Fetch the built installers
        uses: actions/download-artifact@v6
        with:
          name: installers-${{ matrix.os }}
          path: dist

      - name: Install what a desktop Linux has and a runner image does not
        # Neither of these is a dependency of this app, and between them they are
        # everything this job is allowed to install. Whatever the emulator itself
        # needs has to come out of the bundle or this tests nothing.
        #
        # libfuse2 is what an AppImage needs to mount itself. The graphics
        # libraries are the host's driver stack, which AppImage deliberately never
        # bundles because a driver has to match the machine it runs on, the same
        # reason fetch-qemu-linux.sh refuses to bundle glibc.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfuse2 \
            libegl1 libgl1 libgles2 libglx-mesa0 libgl1-mesa-dri libgbm1

      - name: Smoke test the portable AppImage
        # The launcher is a Tauri GUI app with no headless mode, so it needs a
        # display to get past window creation. xvfb-run wraps the script rather
        # than the AppImage so the whole process tree shares one ephemeral
        # server; -a picks a free display number.
        if: runner.os == 'Linux'
        env:
          # Xvfb exposes no DRI device, so WebKitGTK's DMA-BUF renderer has
          # nothing to allocate against and Mesa has no GPU to drive. Both are
          # headless-CI workarounds; neither affects whether the guest boots.
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          app="$(echo dist/*.AppImage)"
          chmod +x "$app"
          xvfb-run -a .github/scripts/smoke-unix.sh "$app"

      - name: Smoke test the portable app bundle
        # Runs the bundle's own executable rather than going through `open`,
        # which returns immediately and leaves no pid to poll or redirect.
        # Artifacts fetched by download-artifact carry no quarantine attribute,
        # and the ad-hoc signature is enough to execute.
        if: runner.os == 'macOS'
        run: |
          unzip -q dist/*.zip -d unpacked
          app="$(find unpacked -maxdepth 1 -name '*.app')"
          exe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          .github/scripts/smoke-unix.sh "$app/Contents/MacOS/$exe"

      - name: Smoke test the portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -Path (Get-Item dist/*.zip).FullName -DestinationPath unpacked
          $exe = Get-ChildItem unpacked -Recurse -Filter "Ark Emulator.exe" | Select-Object -First 1
          if (-not $exe) {
              throw "no Ark Emulator.exe inside the portable zip"
          }
          .github/scripts/smoke-windows.ps1 -Executable $exe.FullName

      - name: Upload the smoke test log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-log-${{ matrix.os }}
          path: smoke*.log
          retention-days: 7
          if-no-files-found: warn
