name: Build and Smoke Test (Reusable)

# Validates the crate once and runs independent build and smoke jobs for each
# platform. Publication waits for every job in this workflow to succeed.
on:
  workflow_call:
    inputs:
      signing-environment:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    # The default Tauri config needs no bundled QEMU or firmware.
    # Validation runs alongside packaging so it adds no serial build delay.
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust artifacts
        # Skipped on tags so a release always builds from scratch.
        if: github.ref_type != 'tag'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --features cli-tests/packaged --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Docs
        run: cargo doc --workspace --locked --no-deps

  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Homebrew's QEMU bottles set the minimum macOS version of the bundle.
          # Keep these labels aligned with bundle.macOS.minimumSystemVersion.
          - os: macos-15
            arch: arm64
            bundles: dmg,app
          - os: macos-15-intel
            arch: amd64
            bundles: dmg,app
          - os: windows-2022
            arch: amd64
            bundles: nsis
          - os: ubuntu-22.04
            arch: amd64
            bundles: deb,appimage
    uses: ./.github/workflows/build-platform.yml
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      bundles: ${{ matrix.bundles }}
      signing-environment: ${{ inputs.signing-environment }}
    secrets: inherit
