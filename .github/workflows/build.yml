name: Build and Smoke Test (Reusable)

# Builds installers for macOS (arm64 + x86_64), Windows, and Linux, then
# smoke tests the no-install artifact of each on a clean machine. Called by
# test-and-build.yml on pull requests and by release.yml on tags, so both
# paths compile and verify identically and a release cannot ship a portable
# build that fails to launch.
#
# Each platform builds natively (no cross-compilation) and bundles its own
# QEMU plus the pinned firmware release for its own host architecture only,
# not both guest architectures (see .github/scripts/fetch-qemu-*), so the
# resulting installers work standalone with nothing to install, and stay
# smaller. The firmware fetch runs per job rather than once shared, since
# which architecture's release assets it needs now depends on each job's own
# host.
#
# Also produces a no-install artifact per platform: the AppImage on Linux,
# the raw .app on macOS, and a hand-assembled portable .zip on Windows
# (NSIS has no portable mode; Tauri gives no other way to get one).
on:
  workflow_call:

env:
  # Firmware images are published to the public dark-bio/emulator-images
  # repo (see fetch-firmware.sh); bumping the bundled firmware is just
  # updating this one value.
  FIRMWARE_TAG: "v0.11.4"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
            bundles: dmg,app
          - os: macos-26-intel
            arch: amd64
            bundles: dmg,app
          - os: windows-2022
            arch: amd64
            bundles: nsis
          - os: ubuntu-22.04
            arch: amd64
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Skipped on tags so a release always builds from scratch, matching
      # what the firmware repo does for its production images.
      - name: Cache Rust artifacts
        if: github.ref_type != 'tag'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # Swatinem/rust-cache covers the target directory and the registry, but
      # not ~/.cargo/bin, so tauri-cli would otherwise be compiled from source
      # on all four runners on every run. `cargo install` exits successfully
      # and near-instantly when the requested version is already present, so
      # it stays as the cache-miss path rather than being skipped.
      #
      # A consequence worth knowing: because any cached 2.x satisfies the "^2"
      # requirement, a restored cache pins the tool at whatever version it was
      # first populated with until the entry is evicted for going a week
      # untouched. Tags skip this cache entirely, so a release is never built
      # by a silently outdated tauri-cli.
      - name: Cache tauri-cli
        if: github.ref_type != 'tag'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: ${{ runner.os }}-${{ runner.arch }}-tauri-cli-v2

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            qemu-system-arm qemu-system-x86 qemu-utils ipxe-qemu

      - name: Fetch bundled QEMU (Linux)
        if: runner.os == 'Linux'
        run: .github/scripts/fetch-qemu-linux.sh

      - name: Fetch bundled QEMU (macOS)
        if: runner.os == 'macOS'
        run: .github/scripts/fetch-qemu-macos.sh

      - name: Fetch bundled QEMU (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/fetch-qemu-windows.ps1

      - name: Fetch pinned firmware release
        # shell: bash is GitHub Actions' own documented cross-platform
        # option: on Windows it runs via the Git for Windows bash already on
        # the runner, the same interpreter fetch-firmware.sh needs, so one
        # step covers all three OSes without a pwsh wrapper subprocess.
        #
        # dark-bio/emulator-images is public, so no secret is needed here;
        # the ambient GITHUB_TOKEN is only for the API rate limit.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/fetch-firmware.sh

      - name: Build
        # tauri.release.conf.json adds the bundled QEMU/firmware to the base
        # config (JSON merge patch, so it only adds those keys). They're kept
        # out of tauri.conf.json because tauri-build validates externalBin
        # paths and resource globs on every cargo invocation, which would
        # make a plain `cargo run` from a fresh clone fail until the fetch
        # scripts had been run.
        run: cargo tauri build --config launcher/tauri.release.conf.json --bundles ${{ matrix.bundles }}

      - name: Verify macOS signature
        # Checks the whole signed tree, not just the main executable, since
        # the bundler signs sidecars and resources through different paths
        # (resources not at all: see fetch-qemu-macos.sh). Each dylib is
        # verified by name because codesign seals a loose .dylib under
        # Resources/ as data rather than as nested code, so --deep alone would
        # report a bundle full of unsigned libraries as valid.
        #
        # The two --display calls are logging, not assertions. The sidecar's
        # is the interesting one: it is the process that needs
        # allow-dyld-environment-variables to find the bundled dylibs at all.
        #
        # spctl is the real Gatekeeper verdict and is expected to reject an
        # ad-hoc build, so it is reported rather than enforced. It is the one
        # check here that flips to green once a Developer ID identity and
        # notarization credentials exist.
        if: runner.os == 'macOS'
        run: |
          app="$(find target/release/bundle/macos -maxdepth 1 -name '*.app')"
          codesign --verify --deep --strict --verbose=2 "$app"
          for lib in "$app/Contents/Resources/qemu-libs"/*.dylib; do
            codesign --verify --strict "$lib"
          done
          codesign --display --entitlements - "$app"
          codesign --display --entitlements - "$app/Contents/MacOS/qemu-system-guest"
          spctl --assess --type exec --verbose=4 "$app" \
            || echo "not accepted by Gatekeeper: ad-hoc signed, not notarized"

      - name: Zip portable macOS app
        # ditto (not zip -r) is Apple's recommended way to archive a .app:
        # plain zip can mangle extended attributes and resource forks.
        # --keepParent so extracting drops a plain "Ark Emulator.app", not
        # its contents loose in the current directory. Named generically
        # here; the final release-asset name is assigned in "Stage
        # artifacts" below.
        if: runner.os == 'macOS'
        run: |
          app="$(find target/release/bundle/macos -maxdepth 1 -name '*.app')"
          ditto -c -k --sequesterRsrc --keepParent "$app" \
            "target/release/bundle/macos/Ark-Emulator.app.zip"

      - name: Build portable Windows zip
        # Tauri's own resource staging only happens inside the NSIS
        # installer's payload, not as a loose directory on disk, so this
        # reassembles the same flat layout by hand: main exe + sidecar exes
        # + qemu-libs/firmware all as siblings, matching both a real install
        # and what BaseDirectory::Resource resolves relative to current_exe()
        # regardless of whether the app was installed or just unzipped.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $portableDir = "target/release/portable/Ark Emulator"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item "target/release/launcher.exe" (Join-Path $portableDir "Ark Emulator.exe")
          Copy-Item "target/release/qemu-system-guest.exe" $portableDir
          Copy-Item "target/release/qemu-img.exe" $portableDir
          Copy-Item "launcher/qemu-libs" (Join-Path $portableDir "qemu-libs") -Recurse
          Copy-Item "launcher/firmware" (Join-Path $portableDir "firmware") -Recurse
          # Named generically; the final release-asset name is assigned in
          # "Stage artifacts" below.
          Compress-Archive -Path $portableDir `
            -DestinationPath "target/release/portable/Ark-Emulator-portable.zip"

      - name: Stage artifacts
        # actions/upload-artifact computes the least common ancestor across
        # every line of a multi-pattern `path:` and preserves the directory
        # structure below it, so pointing it straight at bundle/dmg/,
        # bundle/deb/, etc. produces an artifact with deb/ and appimage/ as
        # actual subdirectories rather than flat files. gh release create
        # then tries to upload a directory as an asset and fails. Staging
        # everything flat here first sidesteps that entirely.
        #
        # Also assigns the final release-asset name here, consistently
        # across every artifact on every platform:
        # ark-emulator-{version}-{os}-{arch}.{ext}, os one of
        # linux/macos/windows, arch one of amd64/arm64. Only a tag carries a
        # version, and GITHUB_REF_NAME is a "<pr>/merge" path fragment on a
        # pull request, so anything else is named after its commit instead.
        # nullglob so a pattern that doesn't apply to this OS (e.g. *.dmg on
        # Linux) just contributes nothing instead of erroring under -e.
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          shopt -s nullglob
          mkdir -p dist
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${GITHUB_SHA:0:7}"
          fi
          os_name="$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
          prefix="dist/ark-emulator-${version}-${os_name}-${ARCH}"

          for f in target/release/bundle/dmg/*.dmg; do cp "$f" "${prefix}.dmg"; done
          for f in target/release/bundle/macos/*.app.zip; do cp "$f" "${prefix}.zip"; done
          for f in target/release/bundle/nsis/*.exe; do cp "$f" "${prefix}.exe"; done
          for f in target/release/portable/*.zip; do cp "$f" "${prefix}.zip"; done
          for f in target/release/bundle/deb/*.deb; do cp "$f" "${prefix}.deb"; done
          for f in target/release/bundle/appimage/*.AppImage; do cp "$f" "${prefix}.AppImage"; done

          ls -la dist/

      - name: Generate checksums
        # Matches the convention already used for the bundled firmware
        # images (see fetch-firmware.sh's verification): a same-named
        # .sha256 file per asset, so anyone downloading a release can verify
        # it themselves. macOS has no sha256sum by default (shasum -a 256
        # instead); Linux and Git for Windows' bundled coreutils both do.
        shell: bash
        run: |
          cd dist
          for f in *; do
            if command -v sha256sum >/dev/null; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done
          ls -la

      - name: Upload installers
        # Uploaded on every run, not just tags: the smoke job downloads these
        # rather than rebuilding, so the artifact it tests is bit-for-bit the
        # one a release would publish.
        uses: actions/upload-artifact@v6
        with:
          name: installers-${{ matrix.os }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  # Launches each platform's no-install artifact on a runner that never had
  # the build job's dependencies installed on it, and waits for the emulated
  # device to finish booting. The build job apt-installs QEMU and webkit and
  # brew-installs QEMU, so it is the wrong machine to test the "nothing to
  # install" claim on; a fresh runner per leg is the whole point. Nothing is
  # installed here beyond AppImage's own FUSE requirement, and no flags are
  # passed to the launcher, so this is a user's first launch: bundled
  # firmware, an empty app data directory, and a qcow2 created from scratch.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
          - os: macos-26-intel
          - os: windows-2022
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Fetch the built installers
        uses: actions/download-artifact@v6
        with:
          name: installers-${{ matrix.os }}
          path: dist

      - name: Install the AppImage runtime requirement
        # libfuse2 is AppImage's own requirement for mounting itself, not a
        # dependency of this app, and the runner images stopped shipping it.
        # It is the only thing this job is allowed to install; anything the
        # emulator itself needs has to come out of the bundle.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: Smoke test the portable AppImage
        # The launcher is a Tauri GUI app with no headless mode, so it needs
        # a display to get past window creation. xvfb-run wraps the script
        # rather than the AppImage so the whole process tree shares one
        # ephemeral server; -a picks a free display number.
        if: runner.os == 'Linux'
        run: |
          app="$(echo dist/*.AppImage)"
          chmod +x "$app"
          xvfb-run -a .github/scripts/smoke-unix.sh "$app"

      - name: Smoke test the portable app bundle
        # Runs the bundle's own executable rather than going through `open`,
        # which returns immediately and leaves no pid to poll or redirect.
        # Artifacts fetched by download-artifact carry no quarantine
        # attribute, and the ad-hoc signature is enough to execute.
        if: runner.os == 'macOS'
        run: |
          unzip -q dist/*.zip -d unpacked
          app="$(find unpacked -maxdepth 1 -name '*.app')"
          exe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          .github/scripts/smoke-unix.sh "$app/Contents/MacOS/$exe"

      - name: Smoke test the portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -Path (Get-Item dist/*.zip).FullName -DestinationPath unpacked
          $exe = Get-ChildItem unpacked -Recurse -Filter "Ark Emulator.exe" | Select-Object -First 1
          if (-not $exe) {
              throw "no Ark Emulator.exe inside the portable zip"
          }
          .github/scripts/smoke-windows.ps1 -Executable $exe.FullName

      - name: Upload the smoke test log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-log-${{ matrix.os }}
          path: smoke*.log
          retention-days: 7
          if-no-files-found: warn
