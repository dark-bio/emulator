name: Build QEMU runtime
description: Reuse QEMU archives or build them on a cache miss, then upload them for native verification.

inputs:
  os:
    description: Native runner label used to name the artifact and cache.
    required: true
  arch:
    description: Guest architecture, amd64 or arm64.
    required: true
  platform:
    description: Runtime platform, linux, macos or windows.
    required: true

runs:
  using: composite
  steps:
    - name: Identify QEMU build inputs
      id: inputs
      shell: bash
      run: |
        cat .github/packaging/qemu/source.json > "$RUNNER_TEMP/qemu-inputs"
        if [ "$RUNNER_OS" = "macOS" ]; then
          xcodebuild -version >> "$RUNNER_TEMP/qemu-inputs"
          xcrun --show-sdk-version >> "$RUNNER_TEMP/qemu-inputs"
          clang --version >> "$RUNNER_TEMP/qemu-inputs"
        fi
        digest=$(shasum -a 256 "$RUNNER_TEMP/qemu-inputs" | cut -d ' ' -f 1)
        echo "hash=$digest" >> "$GITHUB_OUTPUT"

    - name: Cache QEMU archives
      if: github.ref_type != 'tag'
      id: cache
      uses: actions/cache@v6
      with:
          path: target/qemu-${{ inputs.platform }}/artifacts
          # CI wrappers do not affect QEMU or the standalone rebuild recipe.
          key: qemu-v4-${{ inputs.os }}-${{ inputs.arch }}-${{ hashFiles('.github/packaging/qemu/**', '!.github/packaging/qemu/ci/**', 'Makefile', 'Cargo.lock', 'LICENSE') }}-${{ steps.inputs.outputs.hash }}

    - name: Install Rust for the QEMU builder
      if: steps.cache.outputs.cache-hit != 'true'
      uses: dtolnay/rust-toolchain@stable

    - name: Install macOS build tools
      if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
      run: brew install cmake ninja pkgconf python xz

    - name: Build QEMU
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        QEMU_PLATFORM: ${{ inputs.platform }}
      run: make "qemu-$QEMU_PLATFORM"

    # The consumer verifies both archives and exercises QEMU on its native host.
    - uses: actions/upload-artifact@v6
      with:
        name: qemu-${{ inputs.os }}
        path: target/qemu-${{ inputs.platform }}/artifacts/*
        retention-days: 7
        if-no-files-found: error
        compression-level: 0
