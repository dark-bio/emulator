[package]
name = "launcher"
version = "0.1.0"
edition = "2021"

# The executable is what people and agents type, so it carries the product's
# name rather than the crate's. Every bundle and the Homebrew wrapper point at
# this name.
[[bin]]
name = "ark-emulator"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
rfd = "0.17"
tiny_http = { version = "0.12", default-features = false }
sha2 = "0.10"
console = "0.16"
dirs = "6"

[dev-dependencies]
tempfile = "3"

# Orphan cleanup is OS-specific: PDEATHSIG (Linux) needs libc; macOS uses a
# death pipe + /bin/sh (std only). Windows needs windows-sys for a Job Object,
# plus CREATE_NO_WINDOW to suppress spawned QEMU consoles, LibraryLoader to
# probe for WHPX, and Console and FileSystem for the console a command line run
# borrows from the terminal that started it. See src/platform.rs, src/output.rs
# and src/orphan.rs.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
