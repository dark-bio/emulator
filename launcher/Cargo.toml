[package]
name = "launcher"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
clap = { version = "4", features = ["derive"] }

# PDEATHSIG is Linux-only; libc is only needed there.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
