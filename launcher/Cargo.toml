[package]
name = "launcher"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"

# Default features on purpose. On Linux that is the XDG desktop portal (with a
# zenity fallback), not the `gtk3` backend, which spawns a thread of its own to
# iterate GTK's default main context for the rest of the process and would then
# be racing the main thread's loop. The portal touches no GTK and works under
# Wayland and inside sandboxed packaging.
rfd = "0.17"

[dev-dependencies]
tempfile = "3"

# Orphan cleanup is OS-specific: PDEATHSIG (Linux) needs libc; macOS uses a
# death pipe + /bin/sh (std only). Windows needs windows-sys for a Job Object,
# plus CREATE_NO_WINDOW to suppress spawned QEMU consoles and LibraryLoader to
# probe for WHPX. See src/platform.rs and src/orphan.rs.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
