<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>emulator hello-world</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1117;
    --fg: #c9d1d9;
    --muted: #6e7681;
    --accent: #58a6ff;
    --in: #7ee787;
    --out: #ffa657;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 12px 16px;
    border-bottom: 1px solid #21262d;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 { margin: 0; font-size: 14px; font-weight: 600; }
  #status {
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 10px;
    background: #21262d;
    color: var(--muted);
  }
  #status.ok    { color: var(--in); }
  #status.bad   { color: #f85149; }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    white-space: pre-wrap;
    font-size: 13px;
    line-height: 1.5;
  }
  .line.in  { color: var(--in); }
  .line.out { color: var(--out); }
  .line.sys { color: var(--muted); font-style: italic; }
  form {
    display: flex;
    border-top: 1px solid #21262d;
    padding: 10px 12px;
    gap: 8px;
  }
  input {
    flex: 1;
    background: #0d1117;
    color: var(--fg);
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 13px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent);
    color: #0d1117;
    border: none;
    border-radius: 6px;
    padding: 0 16px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
  <header>
    <h1>emulator hello-world</h1>
    <span id="status">connecting...</span>
  </header>
  <div id="log"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="type a message and press enter..." disabled />
    <button id="send" disabled>send</button>
  </form>
<script>
  const log = document.getElementById("log");
  const status = document.getElementById("status");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const form = document.getElementById("form");

  function append(kind, text) {
    const div = document.createElement("div");
    div.className = "line " + kind;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  function setStatus(text, cls) {
    status.textContent = text;
    status.className = cls || "";
  }

  // The bridge runs locally and is independent of however the UI was served
  // (file://, a separate dev server, the dashboard's dev server, etc.).
  // Default to the bridge's standard local address; override with ?bridge=...
  const params = new URLSearchParams(location.search);
  const wsUrl = params.get("bridge") || "ws://127.0.0.1:8080/ws";
  let ws;

  function connect() {
    append("sys", "connecting to " + wsUrl + " ...");
    ws = new WebSocket(wsUrl);
    ws.onopen = () => {
      setStatus("connected", "ok");
      input.disabled = false;
      send.disabled = false;
      input.focus();
    };
    ws.onclose = () => {
      setStatus("disconnected", "bad");
      input.disabled = true;
      send.disabled = true;
      append("sys", "websocket closed, reconnecting in 1s...");
      setTimeout(connect, 1000);
    };
    ws.onerror = () => {
      setStatus("error", "bad");
    };
    ws.onmessage = (ev) => {
      // Server sends text frames from helloware's stdout-on-virtio.
      const chunks = ev.data.split(/\r?\n/);
      for (const chunk of chunks) {
        if (chunk.length) append("in", "  guest > " + chunk);
      }
    };
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const msg = input.value;
    if (!msg || !ws || ws.readyState !== 1) return;
    append("out", "  you   > " + msg);
    ws.send(msg);
    input.value = "";
  });

  connect();
</script>
</body>
</html>
